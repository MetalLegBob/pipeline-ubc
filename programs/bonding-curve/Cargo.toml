[package]
name = "bonding-curve"
version = "0.1.0"
publish = false
edition = "2021"
license = "Apache-2.0"
description = "Pipeline's universal bonding curve: launch any token on a curve, then graduate it into any registered AMM"
repository = "https://github.com/MetalLegBob/pipeline-ubc"

[lib]
crate-type = ["cdylib", "lib"]
name = "bonding_curve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = "=1.2.2"
pipeline-strategy-interface = "0.1"
pipeline-curve-math = { path = "../../crates/pipeline-curve-math" }
solana-sha256-hasher = "3.1.0"
